<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Lista de Compras</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link para o CSS Separado -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-emerald-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Cabeçalho Superior -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-600 p-2.5 rounded-xl shadow-inner">
                    <i class="fa-solid fa-cart-shopping text-2xl text-emerald-100"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Super Lista de Compras</h1>
                    <p class="text-xs text-emerald-200">Organize suas compras e controle o orçamento</p>
                </div>
            </div>

            <!-- Card do Total Geral -->
            <div
                class="bg-emerald-800 border border-emerald-600 px-5 py-2.5 rounded-2xl shadow-inner flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-start">
                <div>
                    <span class="block text-xs text-emerald-300 font-medium uppercase tracking-wider">Total
                        Estimado</span>
                    <span id="grand-total" class="text-2xl font-black text-white">R$ 0,00</span>
                </div>
                <button id="btn-reset"
                    class="bg-emerald-600 hover:bg-emerald-500 text-emerald-100 text-xs px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1 shadow-sm"
                    title="Limpar preços, quantidades e seleções">
                    <i class="fa-solid fa-rotate-right"></i> Resetar
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Barra de Ferramentas (Busca e Novo Item) -->
        <div
            class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Buscar produto..."
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
            </div>

            <button onclick="openModal()"
                class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Adicionar Novo Item
            </button>
        </div>

        <!-- Abas de Navegação por Categoria -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-thin" id="category-tabs">
            <!-- Gerado dinamicamente via JS -->
        </div>

        <!-- Lista de Categorias e Produtos -->
        <div id="categories-container" class="space-y-6">
            <!-- Itens injetados via JS -->
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-emerald-100 mt-12 py-6 text-center text-xs text-slate-500 font-medium">
        <p>Desenvolvido por Jescklay Mattos</p>
    </footer>

    <!-- Modal para Adicionar Novo Item -->
    <div id="item-modal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-lg text-emerald-800 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-emerald-600"></i> Novo Produto
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="add-item-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nome do
                        Produto</label>
                    <input type="text" id="new-item-name" required placeholder="Ex: Azeite Extra Virgem"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>

                <div>
                    <label
                        class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Categoria</label>
                    <select id="new-item-category"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        <!-- Preenchido via JS -->
                    </select>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium shadow-sm transition">Salvar
                        Produto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>

</html>
